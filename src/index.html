<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="home-page-wrapper">
      <div class="home-page">
        <form id="weather-task-form">
          <label for="city-input" id="city-label"> Weather App </label>
          <input
            type="text"
            placeholder="Please enter a city..."
            id="city-input"
            name="citySelected"
            minlength="1"
            maxlength="169"
            required
          />
        </form>
      </div>
    </div>
  </body>
</html>
